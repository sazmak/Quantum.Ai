<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Дорожная карта «сначала проверка»: v0.1 — прототип поиска (сейчас), v0.2 — реальные материалы и подключённая LLM, затем пилот и решения после пилота.">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1E"/>
      <stop offset="100%" stop-color="#0E1633"/>
    </linearGradient>
    <linearGradient id="rcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2450" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111938" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="rcardNow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26315F" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#141C3E" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="rtrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="rhr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="rglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="rdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#5B6BA8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#rbg)"/>
  <rect width="1200" height="400" rx="16" fill="url(#rdots)"/>

  <text x="48" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#EAF0FF">Сначала проверка, потом функции</text>
  <text x="48" y="76" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9CC8">Без дат. Каждый этап открывается, только когда предыдущий даёт доказательства, — и остановка допустима.</text>
  <rect x="48" y="92" width="1104" height="1.5" fill="url(#rhr)"/>

  <!-- you are here -->
  <g transform="translate(113 118)">
    <rect width="128" height="28" rx="14" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text x="64" y="18.5" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#A5F3FC">ВЫ ЗДЕСЬ</text>
    <path d="M 57 28 L 64 36 L 71 28 Z" fill="#22D3EE" fill-opacity="0.6"/>
  </g>

  <!-- track -->
  <line x1="48" y1="176" x2="177" y2="176" stroke="url(#rtrack)" stroke-width="3" stroke-linecap="round"/>
  <line x1="177" y1="176" x2="1152" y2="176" stroke="#3A4785" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round"/>

  <circle cx="177" cy="176" r="16" fill="#22D3EE" opacity="0.35" filter="url(#rglow)"/>
  <circle cx="177" cy="176" r="9" fill="#0B1026" stroke="#22D3EE" stroke-width="3"/>
  <circle cx="459" cy="176" r="8" fill="#0B1026" stroke="#818CF8" stroke-width="2.5"/>
  <circle cx="741" cy="176" r="8" fill="#0B1026" stroke="#5A67A8" stroke-width="2.5"/>
  <circle cx="1023" cy="176" r="8" fill="#0B1026" stroke="#4A5691" stroke-width="2.5"/>

  <!-- v0.1 -->
  <g transform="translate(48 206)">
    <rect width="258" height="140" rx="14" fill="url(#rcardNow)" stroke="#2E7A8C"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#67E8F9">v0.1</text>
    <text x="20" y="58" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#F1F5FF">Прототип поиска</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9BA9D2">
      <tspan x="20" y="80">Закрытое веб-приложение,</tspan>
      <tspan x="20" y="97">поиск по демо, UI источников.</tspan>
    </text>
    <line x1="20" y1="110" x2="238" y2="110" stroke="#33407A"/>
    <text x="20" y="128" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#67E8F9">Текущий этап</text>
  </g>

  <!-- v0.2 -->
  <g transform="translate(330 206)">
    <rect width="258" height="140" rx="14" fill="url(#rcard)" stroke="#3A3F84"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#818CF8"/>
    <text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#A5B4FC">v0.2</text>
    <text x="20" y="58" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#E2E8FF">Ответы с опорой</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8E9CC8">
      <tspan x="20" y="80">Реальные материалы Quantum,</tspan>
      <tspan x="20" y="97">первая LLM, ссылки.</tspan>
    </text>
    <line x1="20" y1="110" x2="238" y2="110" stroke="#2A3462"/>
    <text x="20" y="128" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7C86C4">Порог: оценки от учителя</text>
  </g>

  <!-- Пилот -->
  <g transform="translate(612 206)">
    <rect width="258" height="140" rx="14" fill="url(#rcard)" stroke="#2A3462"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#5A67A8"/>
    <text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#8E9CC8">Пилот</text>
    <text x="20" y="58" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#C9D3F0">Учитель, затем ученики</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7E8CB8">
      <tspan x="20" y="80">Одна тема информатики,</tspan>
      <tspan x="20" y="97">малая группа, договор.</tspan>
    </text>
    <line x1="20" y1="110" x2="238" y2="110" stroke="#2A3462"/>
    <text x="20" y="128" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6E7AB8">Порог: отчёт по пилоту</text>
  </g>

  <!-- После пилота -->
  <g transform="translate(894 206)">
    <rect width="258" height="140" rx="14" fill="url(#rcard)" stroke="#2A3462"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#4A5691"/>
    <text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#7E8CB8">После пилота</text>
    <text x="20" y="58" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#AEBAD8">Строить или стоп</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7E8CB8">
      <tspan x="20" y="80">Подготовка, репетитор</tspan>
      <tspan x="20" y="97">и аналитика — если заслужено.</tspan>
    </text>
    <line x1="20" y1="110" x2="238" y2="110" stroke="#2A3462"/>
    <text x="20" y="128" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6E7AB8">Порог: go / no-go по итогам</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="none" stroke="#2A3566" stroke-opacity="0.8"/>
</svg>
