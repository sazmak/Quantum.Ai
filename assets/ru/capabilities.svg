<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Карта возможностей: Ask Quantum частично реализован; режим репетитора, подготовка к экзамену, карточки, тесты, симулятор экзамена, план занятий и аналитика для учителя — только в планах.">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1E"/>
      <stop offset="100%" stop-color="#0E1633"/>
    </linearGradient>
    <linearGradient id="ccard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2450" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111938" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ccardLive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26315F" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#141C3E" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="chr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#5B6BA8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" rx="16" fill="url(#cbg)"/>
  <rect width="1200" height="560" rx="16" fill="url(#cdots)"/>

  <text x="48" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#EAF0FF">Карта возможностей</text>
  <text x="48" y="76" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9CC8">Одна возможность частично реальна. Остальное — заявленное намерение, показанное здесь, чтобы не приходилось гадать.</text>
  <rect x="48" y="92" width="1104" height="1.5" fill="url(#chr)"/>

  <!-- Ask Quantum : ЧАСТИЧНО -->
  <g transform="translate(48 122)">
    <rect width="258" height="152" rx="14" fill="url(#ccardLive)" stroke="#5A4A9E"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#F59E0B"/>
    <g transform="translate(20 24)">
      <rect width="36" height="36" rx="11" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.45"/>
      <g transform="translate(9 10)" stroke="#FBBF24" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 4 C1 2.3 2.3 1 4 1 L14 1 C15.7 1 17 2.3 17 4 L17 10 C17 11.7 15.7 13 14 13 L7 13 L3.5 16 L3.5 13 L4 13 C2.3 13 1 11.7 1 10 Z"/>
      </g>
    </g>
    <text x="20" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F8FAFF">Ask Quantum</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#98A5CE">
      <tspan x="20" y="115">Ответы на основе одобренных</tspan>
      <tspan x="20" y="132">школьных материалов.</tspan>
    </text>
    <g transform="translate(174 20)">
      <rect width="66" height="24" rx="12" fill="#F59E0B" fill-opacity="0.16" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="33" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FCD34D">ЧАСТИЧНО</text>
    </g>
  </g>

  <!-- Режим репетитора -->
  <g transform="translate(330 122)">
    <rect width="258" height="152" rx="14" fill="url(#ccard)" stroke="#2A3462"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#3E4A7D"/>
    <g transform="translate(20 24)">
      <rect width="36" height="36" rx="11" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-opacity="0.4"/>
      <g transform="translate(10 9)" stroke="#94A3B8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 1 C11.6 1 14 3.6 14 6.8 C14 9.4 12 10.6 11.5 13 L4.5 13 C4 10.6 2 9.4 2 6.8 C2 3.6 4.4 1 8 1 Z"/>
        <path d="M5.6 16.2 L10.4 16.2"/>
      </g>
    </g>
    <text x="20" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C9D3F0">Режим репетитора</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7E8CB8">
      <tspan x="20" y="115">Подсказки и разбор шагов,</tspan>
      <tspan x="20" y="132">а не только готовый ответ.</tspan>
    </text>
    <g transform="translate(166 20)">
      <rect width="74" height="24" rx="12" fill="#64748B" fill-opacity="0.14" stroke="#64748B" stroke-opacity="0.45"/>
      <text x="37" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8B4CE">В ПЛАНАХ</text>
    </g>
  </g>

  <!-- Подготовка к экзамену -->
  <g transform="translate(612 122)">
    <rect width="258" height="152" rx="14" fill="url(#ccard)" stroke="#2A3462"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#3E4A7D"/>
    <g transform="translate(20 24)">
      <rect width="36" height="36" rx="11" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-opacity="0.4"/>
      <g transform="translate(10 9)" stroke="#94A3B8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3.5 C2 2.4 2.9 1.5 4 1.5 L12 1.5 C13.1 1.5 14 2.4 14 3.5 L14 16 C14 17.1 13.1 18 12 18 L4 18 C2.9 18 2 17.1 2 16 Z"/>
        <path d="M6 1.5 L6 0 L10 0 L10 1.5"/>
        <path d="M5.4 10.5 L7.2 12.3 L11 8.2"/>
      </g>
    </g>
    <text x="20" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C9D3F0">Подготовка к экзамену</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7E8CB8">
      <tspan x="20" y="115">Практика по слабым темам</tspan>
      <tspan x="20" y="132">и повторение.</tspan>
    </text>
    <g transform="translate(166 20)">
      <rect width="74" height="24" rx="12" fill="#64748B" fill-opacity="0.14" stroke="#64748B" stroke-opacity="0.45"/>
      <text x="37" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8B4CE">В ПЛАНАХ</text>
    </g>
  </g>

  <!-- Карточки -->
  <g transform="translate(894 122)">
    <rect width="258" height="152" rx="14" fill="url(#ccard)" stroke="#2A3462"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#3E4A7D"/>
    <g transform="translate(20 24)">
      <rect width="36" height="36" rx="11" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-opacity="0.4"/>
      <g transform="translate(9 10)" stroke="#94A3B8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0.5" y="4" width="13" height="11" rx="2"/>
        <path d="M4 1.5 L15 1.5 C16.4 1.5 17.5 2.6 17.5 4 L17.5 12"/>
      </g>
    </g>
    <text x="20" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C9D3F0">Карточки</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7E8CB8">
      <tspan x="20" y="115">Интервальное повторение</tspan>
      <tspan x="20" y="132">по одобренным материалам.</tspan>
    </text>
    <g transform="translate(166 20)">
      <rect width="74" height="24" rx="12" fill="#64748B" fill-opacity="0.14" stroke="#64748B" stroke-opacity="0.45"/>
      <text x="37" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8B4CE">В ПЛАНАХ</text>
    </g>
  </g>

  <!-- Тесты -->
  <g transform="translate(48 298)">
    <rect width="258" height="152" rx="14" fill="url(#ccard)" stroke="#2A3462"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#3E4A7D"/>
    <g transform="translate(20 24)">
      <rect width="36" height="36" rx="11" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-opacity="0.4"/>
      <g transform="translate(9 10)" stroke="#94A3B8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 3 L3 5 L6.5 1.4"/>
        <path d="M1 11 L3 13 L6.5 9.4"/>
        <path d="M10 3.2 L17 3.2 M10 11.2 L17 11.2"/>
      </g>
    </g>
    <text x="20" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C9D3F0">Тесты</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7E8CB8">
      <tspan x="20" y="115">Короткие проверки по темам,</tspan>
      <tspan x="20" y="132">которые прошёл класс.</tspan>
    </text>
    <g transform="translate(166 20)">
      <rect width="74" height="24" rx="12" fill="#64748B" fill-opacity="0.14" stroke="#64748B" stroke-opacity="0.45"/>
      <text x="37" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8B4CE">В ПЛАНАХ</text>
    </g>
  </g>

  <!-- Симулятор экзамена -->
  <g transform="translate(330 298)">
    <rect width="258" height="152" rx="14" fill="url(#ccard)" stroke="#2A3462"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#3E4A7D"/>
    <g transform="translate(20 24)">
      <rect width="36" height="36" rx="11" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-opacity="0.4"/>
      <g transform="translate(9 9)" stroke="#94A3B8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="10.5" r="7.5"/>
        <path d="M9 6.5 L9 10.5 L11.8 12"/>
        <path d="M6.5 1 L11.5 1"/>
      </g>
    </g>
    <text x="20" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C9D3F0">Симулятор экзамена</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7E8CB8">
      <tspan x="20" y="115">Практика на время</tspan>
      <tspan x="20" y="132">в условиях экзамена.</tspan>
    </text>
    <g transform="translate(166 20)">
      <rect width="74" height="24" rx="12" fill="#64748B" fill-opacity="0.14" stroke="#64748B" stroke-opacity="0.45"/>
      <text x="37" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8B4CE">В ПЛАНАХ</text>
    </g>
  </g>

  <!-- План занятий -->
  <g transform="translate(612 298)">
    <rect width="258" height="152" rx="14" fill="url(#ccard)" stroke="#2A3462"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#3E4A7D"/>
    <g transform="translate(20 24)">
      <rect width="36" height="36" rx="11" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-opacity="0.4"/>
      <g transform="translate(9 9)" stroke="#94A3B8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0.5" y="2.5" width="17" height="15" rx="2.5"/>
        <path d="M0.5 7 L17.5 7 M5 0.8 L5 4 M13 0.8 L13 4"/>
        <path d="M5.5 11.5 L8 14 L12.5 9.6"/>
      </g>
    </g>
    <text x="20" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C9D3F0">План занятий</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7E8CB8">
      <tspan x="20" y="115">Планирование и напоминания</tspan>
      <tspan x="20" y="132">о предстоящих задачах.</tspan>
    </text>
    <g transform="translate(166 20)">
      <rect width="74" height="24" rx="12" fill="#64748B" fill-opacity="0.14" stroke="#64748B" stroke-opacity="0.45"/>
      <text x="37" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8B4CE">В ПЛАНАХ</text>
    </g>
  </g>

  <!-- Аналитика для учителя -->
  <g transform="translate(894 298)">
    <rect width="258" height="152" rx="14" fill="url(#ccard)" stroke="#2A3462"/>
    <rect x="0" y="0" width="258" height="3" rx="1.5" fill="#3E4A7D"/>
    <g transform="translate(20 24)">
      <rect width="36" height="36" rx="11" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-opacity="0.4"/>
      <g transform="translate(9 10)" stroke="#94A3B8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 16 L17 16"/>
        <path d="M4 16 L4 9 M9 16 L9 4 M14 16 L14 11"/>
      </g>
    </g>
    <text x="20" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C9D3F0">Аналитика для учителя</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7E8CB8">
      <tspan x="20" y="115">Сводка слабых тем —</tspan>
      <tspan x="20" y="132">без личных чатов.</tspan>
    </text>
    <g transform="translate(166 20)">
      <rect width="74" height="24" rx="12" fill="#64748B" fill-opacity="0.14" stroke="#64748B" stroke-opacity="0.45"/>
      <text x="37" y="16" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A8B4CE">В ПЛАНАХ</text>
    </g>
  </g>

  <text x="48" y="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7C86C4">Здесь нет дат. Каждая запланированная возможность зависит от того, докажет ли пилот, что её стоит строить.</text>

  <rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="none" stroke="#2A3566" stroke-opacity="0.8"/>
</svg>
