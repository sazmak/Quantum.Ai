<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Бағалау таблосы, әр ұяшық әдейі бос: дұрыстық, дереккөз дәлдігі, пайдалылық, галлюцинация деңгейі, кідіріс, қайталап қолдану, мұғалім пікірі. Ойдан шығарылған баға жоқ.">
  <defs>
    <linearGradient id="ebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1E"/>
      <stop offset="100%" stop-color="#0E1633"/>
    </linearGradient>
    <linearGradient id="ecard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2450" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111938" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ehr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="edots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#5B6BA8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#ebg)"/>
  <rect width="1200" height="400" rx="16" fill="url(#edots)"/>

  <text x="48" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#EAF0FF">Табло — әдейі бос</text>
  <text x="48" y="76" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9CC8">Бұл метрикаларды мұғалім тексерген v0.2 жүрісі толтыруы тиіс. Ол болғанша, төмендегі ұяшықтар бос.</text>
  <rect x="48" y="92" width="1104" height="1.5" fill="url(#ehr)"/>

  <g transform="translate(48 118)">
    <rect width="258" height="120" rx="14" fill="url(#ecard)" stroke="#2A3462"/>
    <text x="18" y="32" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8FF">Дұрыстық</text>
    <text x="18" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">Рубрика 0&#8211;2, мұғаліммен бірге</text>
    <rect x="18" y="66" width="222" height="38" rx="9" fill="none" stroke="#3A4785" stroke-dasharray="5 5"/>
    <text x="129" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E6AA5">әзірге дерек жоқ</text>
  </g>

  <g transform="translate(330 118)">
    <rect width="258" height="120" rx="14" fill="url(#ecard)" stroke="#2A3462"/>
    <text x="18" y="32" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8FF">Дереккөз дәлдігі</text>
    <text x="18" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">Дереккөз жауапты растай ма?</text>
    <rect x="18" y="66" width="222" height="38" rx="9" fill="none" stroke="#3A4785" stroke-dasharray="5 5"/>
    <text x="129" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E6AA5">әзірге дерек жоқ</text>
  </g>

  <g transform="translate(612 118)">
    <rect width="258" height="120" rx="14" fill="url(#ecard)" stroke="#2A3462"/>
    <text x="18" y="32" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8FF">Пайдалылық</text>
    <text x="18" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">1&#8211;5, оқушы және / немесе мұғалім</text>
    <rect x="18" y="66" width="222" height="38" rx="9" fill="none" stroke="#3A4785" stroke-dasharray="5 5"/>
    <text x="129" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E6AA5">әзірге дерек жоқ</text>
  </g>

  <g transform="translate(894 118)">
    <rect width="258" height="120" rx="14" fill="url(#ecard)" stroke="#2A3462"/>
    <text x="18" y="32" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8FF">Галлюцинация деңгейі</text>
    <text x="18" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">Расталмаған тұжырымдар</text>
    <rect x="18" y="66" width="222" height="38" rx="9" fill="none" stroke="#3A4785" stroke-dasharray="5 5"/>
    <text x="129" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E6AA5">әзірге дерек жоқ</text>
  </g>

  <g transform="translate(48 254)">
    <rect width="258" height="120" rx="14" fill="url(#ecard)" stroke="#2A3462"/>
    <text x="18" y="32" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8FF">Кідіріс</text>
    <text x="18" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">Пайдалы жауапқа дейінгі уақыт</text>
    <rect x="18" y="66" width="222" height="38" rx="9" fill="none" stroke="#3A4785" stroke-dasharray="5 5"/>
    <text x="129" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E6AA5">әзірге дерек жоқ</text>
  </g>

  <g transform="translate(330 254)">
    <rect width="258" height="120" rx="14" fill="url(#ecard)" stroke="#2A3462"/>
    <text x="18" y="32" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8FF">Қайталап қолдану</text>
    <text x="18" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">Тек келісілген ережелер бойынша</text>
    <rect x="18" y="66" width="222" height="38" rx="9" fill="none" stroke="#3A4785" stroke-dasharray="5 5"/>
    <text x="129" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E6AA5">әзірге дерек жоқ</text>
  </g>

  <g transform="translate(612 254)">
    <rect width="258" height="120" rx="14" fill="url(#ecard)" stroke="#2A3462"/>
    <text x="18" y="32" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8FF">Мұғалім пікірі</text>
    <text x="18" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">Сапалық, әрі жалғастыру / тоқтату</text>
    <rect x="18" y="66" width="222" height="38" rx="9" fill="none" stroke="#3A4785" stroke-dasharray="5 5"/>
    <text x="129" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5E6AA5">әзірге дерек жоқ</text>
  </g>

  <g transform="translate(894 254)">
    <rect width="258" height="120" rx="14" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.45"/>
    <g transform="translate(18 22)" stroke="#67E8F9" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 1 L16.5 4.2 L16.5 9.5 C16.5 13.8 13.4 16.9 9 18.5 C4.6 16.9 1.5 13.8 1.5 9.5 L1.5 4.2 Z"/>
      <path d="M5.8 9.6 L8 11.8 L12.2 7.4"/>
    </g>
    <text x="18" y="70" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#A5F3FC">Біздің ереже</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8FC9D8">
      <tspan x="18" y="90">Бұл репозиторийде ойдан</tspan>
      <tspan x="18" y="107">шығарылған баға жоқ. Ешқашан.</tspan>
    </text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="none" stroke="#2A3566" stroke-opacity="0.8"/>
</svg>
