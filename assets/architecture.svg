<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Target pilot architecture: client layer, pilot backend with API, retriever, LLM and citation checks, and an approved school knowledge index. Status dots mark what exists in MVP 0.1.">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1E"/>
      <stop offset="100%" stop-color="#0E1633"/>
    </linearGradient>
    <linearGradient id="anode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2554" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#111938" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="ahr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <marker id="aArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6E7AB8"/>
    </marker>
    <pattern id="adots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#5B6BA8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" rx="16" fill="url(#abg)"/>
  <rect width="1200" height="620" rx="16" fill="url(#adots)"/>

  <text x="48" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#EAF0FF">Target pilot architecture</text>
  <text x="48" y="76" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9CC8">As simple as the pilot requires. The dots say what actually exists today &#8212; most of this is still to be built.</text>
  <rect x="48" y="92" width="1104" height="1.5" fill="url(#ahr)"/>

  <!-- ============ BAND A : CLIENT ============ -->
  <rect x="48" y="118" width="1104" height="112" rx="14" fill="#0C1330" fill-opacity="0.6" stroke="#232D5C"/>
  <line x1="104" y1="130" x2="104" y2="218" stroke="#232D5C"/>
  <text transform="translate(78 174) rotate(-90)" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#6E7AB8">CLIENT</text>

  <g transform="translate(128 142)">
    <rect width="240" height="64" rx="12" fill="url(#anode)" stroke="#33407A"/>
    <g transform="translate(18 19)" stroke="#67E8F9" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="7" r="4.2"/>
      <path d="M1.6 21 C1.6 16.4 5 14 9 14 C13 14 16.4 16.4 16.4 21"/>
    </g>
    <text x="52" y="30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#EAF0FF">Student / Teacher</text>
    <text x="52" y="48" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">asks a real class question</text>
  </g>

  <g stroke="#4A5691" stroke-width="1.7" fill="none" marker-end="url(#aArrow)"><path d="M 372 174 L 398 174"/></g>

  <g transform="translate(404 142)">
    <rect width="240" height="64" rx="12" fill="url(#anode)" stroke="#33407A"/>
    <g transform="translate(18 20)" stroke="#67E8F9" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="18" height="14" rx="2.5"/>
      <path d="M1 5.4 L19 5.4 M6 19 L14 19 M10 15 L10 19"/>
    </g>
    <text x="52" y="30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#EAF0FF">Web App</text>
    <text x="52" y="48" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">chat UI, sources, rating, export</text>
    <circle cx="222" cy="16" r="4.5" fill="#34D399"/>
  </g>

  <!-- connectors between bands -->
  <g stroke="#4A5691" stroke-width="1.7" fill="none" marker-end="url(#aArrow)">
    <path d="M 524 206 L 524 228 L 242 228 L 242 296"/>
  </g>
  <text x="536" y="224" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7C86C4">question</text>

  <g stroke="#34D399" stroke-opacity="0.75" stroke-width="1.7" fill="none" marker-end="url(#aArrow)">
    <path d="M 1022 296 L 1022 248 L 644 248 L 644 210"/>
  </g>
  <text x="656" y="244" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6EE7B7">answer + sources</text>

  <!-- ============ BAND B : BACKEND ============ -->
  <rect x="48" y="262" width="1104" height="152" rx="14" fill="#0C1330" fill-opacity="0.6" stroke="#232D5C"/>
  <line x1="104" y1="276" x2="104" y2="400" stroke="#232D5C"/>
  <text transform="translate(78 338) rotate(-90)" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#6E7AB8">PILOT BACKEND</text>

  <g transform="translate(128 300)">
    <rect width="228" height="76" rx="12" fill="url(#anode)" stroke="#33407A"/>
    <text x="18" y="30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#EAF0FF">App API</text>
    <text x="18" y="50" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">routing, session, logging</text>
    <text x="18" y="66" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6E7AB8">no production auth or tenancy yet</text>
    <circle cx="210" cy="16" r="4.5" fill="#64748B"/>
  </g>

  <g stroke="#4A5691" stroke-width="1.7" fill="none" marker-end="url(#aArrow)"><path d="M 360 338 L 382 338"/></g>

  <g transform="translate(388 300)">
    <rect width="228" height="76" rx="12" fill="url(#anode)" stroke="#4B3F8F"/>
    <text x="18" y="30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#EAF0FF">Retriever / RAG</text>
    <text x="18" y="50" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">approved chunks only</text>
    <text x="18" y="66" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#B79BE8">works today &#8212; over demo notes</text>
    <circle cx="210" cy="16" r="4.5" fill="#F59E0B"/>
  </g>

  <g stroke="#4A5691" stroke-width="1.7" fill="none" marker-end="url(#aArrow)"><path d="M 620 338 L 642 338"/></g>

  <g transform="translate(648 300)">
    <rect width="228" height="76" rx="12" fill="url(#anode)" stroke="#33407A"/>
    <text x="18" y="30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#EAF0FF">LLM</text>
    <text x="18" y="50" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">provider API or local model</text>
    <text x="18" y="66" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6E7AB8">not connected to school content</text>
    <circle cx="210" cy="16" r="4.5" fill="#64748B"/>
  </g>

  <g stroke="#4A5691" stroke-width="1.7" fill="none" marker-end="url(#aArrow)"><path d="M 880 338 L 902 338"/></g>

  <g transform="translate(908 300)">
    <rect width="228" height="76" rx="12" fill="url(#anode)" stroke="#33407A"/>
    <text x="18" y="30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#EAF0FF">Citation / refusal checks</text>
    <text x="18" y="50" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">supported by a source, or refuse</text>
    <text x="18" y="66" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6E7AB8">design intent, not implemented</text>
    <circle cx="210" cy="16" r="4.5" fill="#64748B"/>
  </g>

  <!-- backend to knowledge -->
  <g stroke="#4A5691" stroke-width="1.7" fill="none" marker-end="url(#aArrow)"><path d="M 470 380 L 470 468"/></g>
  <g stroke="#8B5CF6" stroke-opacity="0.8" stroke-width="1.7" fill="none" marker-end="url(#aArrow)"><path d="M 540 468 L 540 380"/></g>
  <text x="556" y="430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#B79BE8">approved chunks</text>
  <text x="462" y="430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7C86C4" text-anchor="end">query</text>

  <!-- ============ BAND C : KNOWLEDGE ============ -->
  <rect x="48" y="452" width="1104" height="112" rx="14" fill="#0C1330" fill-opacity="0.6" stroke="#232D5C"/>
  <line x1="104" y1="464" x2="104" y2="552" stroke="#232D5C"/>
  <text transform="translate(78 508) rotate(-90)" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#6E7AB8">KNOWLEDGE</text>

  <g transform="translate(128 476)">
    <rect width="1008" height="64" rx="12" fill="url(#anode)" stroke="#33407A"/>
    <g transform="translate(20 20)" stroke="#A5B4FC" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3 L11 3 L14.5 6.5 L14.5 21 L2 21 Z"/>
      <path d="M5 11 L11.5 11 M5 15 L11.5 15"/>
    </g>
    <text x="54" y="29" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#EAF0FF">Approved school knowledge index</text>
    <text x="54" y="48" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8E9CC8">Teacher-approved Quantum STEM materials &#8212; today this is demo notes, not the real corpus.</text>
    <circle cx="988" cy="16" r="4.5" fill="#F59E0B"/>
  </g>

  <!-- legend -->
  <g transform="translate(48 588)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12">
    <circle cx="6" cy="-4" r="4.5" fill="#34D399"/>
    <text x="18" y="0" fill="#93A0C4">Exists in MVP 0.1</text>
    <circle cx="164" cy="-4" r="4.5" fill="#F59E0B"/>
    <text x="176" y="0" fill="#93A0C4">Partial &#8212; demo content only</text>
    <circle cx="380" cy="-4" r="4.5" fill="#64748B"/>
    <text x="392" y="0" fill="#93A0C4">Not yet built</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="619" rx="16" fill="none" stroke="#2A3566" stroke-opacity="0.8"/>
</svg>
